<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Evaluator</title>
    <!-- Styling -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 700px;
        }
        
        h1 {
            font-size: 32px;
            color: #1a202c;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            font-size: 16px;
            color: #718096;
            text-align: center;
            margin-bottom: 30px;
        }
        
        textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        button {
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Startup Evaluator</h1>
        <p class="subtitle">Describe your startup pitch</p>
        <!-- Input field for pitch -->
        <textarea id="pitch" placeholder="Enter your startup pitch here..."></textarea>
        <!-- Submit button -->
        <button onclick="evaluate()">Evaluate</button>
    </div>
    
    <script>
        // Handle button click
        function evaluate() {
            const pitch = document.getElementById('pitch').value;
            alert('Pitch received:\n\n' + pitch);
        }
    </script>
</body>
</html>
